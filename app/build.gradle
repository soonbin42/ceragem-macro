plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.jinanhealing.ceragemmacro'
    compileSdk 34

    defaultConfig {
        applicationId "com.jinanhealing.ceragemmacro"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    signingConfigs {
        shared {
            storeFile file('../keystore/shared.jks')
            storePassword 'ceragem123'
            keyAlias 'ceragem'
            keyPassword 'ceragem123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
